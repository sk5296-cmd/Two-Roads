<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two Roads to Freedom</title>
  <style>
    /* Premium Modern Dark Theme */
    body {
      background: radial-gradient(circle at top left, #1f1c2c, #000000);
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    
    header {
      position: relative;
      padding: 4rem 2rem;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 4px solid #f59e0b;
      min-height: 400px;
    }

    /* Left side - Delaware Crossing */
    header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; bottom: 0; width: 50%;
      background-image: url('https://upload.wikimedia.org/wikipedia/commons/9/95/Washington_Crossing_the_Delaware_by_Emanuel_Leutze%2C_MMA-NYC%2C_1851.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0.5;
    }

    /* Right side - Parting the Red Sea */
    header::after {
      content: '';
      position: absolute;
      top: 0; right: 0; bottom: 0; width: 50%;
      background-image: url('https://israelicenterofjudaica.com/wp-content/uploads/2024/05/YCPE03-3.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0.5;
    }

    /* Overlay line down the middle */
    .header-divider {
      position: absolute;
      top: 0; bottom: 0; left: 50%;
      width: 4px;
      background: #f59e0b;
      z-index: 1;
      transform: translateX(-50%);
      box-shadow: 0 0 15px #f59e0b;
    }

    .header-content {
      position: relative;
      z-index: 2;
      text-align: center;
      background: rgba(15, 15, 20, 0.85);
      padding: 2rem 3rem;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(5px);
    }

    .portraits {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 1.5rem;
    }

    .portraits img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #f59e0b;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 3.5rem;
      margin: 0 0 1rem 0;
      text-transform: uppercase;
      letter-spacing: 4px;
      font-weight: 900;
      text-shadow: 0 4px 10px rgba(0,0,0,0.8);
    }

    p.intro {
      font-size: 1.2rem;
      max-width: 700px;
      margin: 0 auto;
      font-weight: 500;
      line-height: 1.6;
      color: #fca5a5;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 2rem 1rem;
      flex-wrap: wrap;
      background: rgba(26, 26, 26, 0.8);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    nav a {
      color: #cbd5e1;
      text-decoration: none;
      padding: 0.8rem 1.5rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      transition: all 0.3s ease;
      font-weight: 600;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    nav a:hover {
      background: #ef4444;
      color: #fff;
      border-color: #ef4444;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
    }

    main {
      max-width: 1200px;
      margin: 4rem auto;
      padding: 0 2rem;
    }
    
    h2 {
      color: #fff;
      font-size: 2.8rem;
      text-align: center;
      margin-bottom: 3rem;
      position: relative;
    }

    h2::after {
      content: '';
      display: block;
      width: 60px;
      height: 4px;
      background: #f59e0b;
      margin: 1rem auto 0;
      border-radius: 2px;
    }

    /* Interactive Flip Cards Grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2.5rem;
    }

    .flip-card {
      background-color: transparent;
      height: 300px;
      perspective: 1000px;
      cursor: pointer;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border-radius: 16px;
    }

    .flip-card:hover .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
