<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Leaders - Two Roads to Freedom</title>
    <style>
        /* Premium Modern Dark Theme - Matching Index */
        body {
            background: radial-gradient(circle at top left, #1f1c2c, #000000);
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding: 2rem 1rem;
            flex-wrap: wrap;
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border-bottom: 2px solid #f59e0b;
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 0.8rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        nav a:hover, nav a.active {
            background: #ef4444;
            color: #fff;
            border-color: #ef4444;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
        }

        main {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        h1 {
            color: #fff;
            font-size: 3.5rem;
            text-align: center;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 900;
            text-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }

        h1::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background: #f59e0b;
            margin: 1.5rem auto 3rem;
            border-radius: 2px;
            box-shadow: 0 0 10px #f59e0b;
        }

        p.subtitle {
            text-align: center;
            font-size: 1.2rem;
            max-width: 800px;
            margin: 0 auto 4rem auto;
            color: #fca5a5;
            line-height: 1.6;
        }

        /* Leader Comparison Grid */
        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
        }

        @media (max-width: 900px) {
            .comparison-grid {
                grid-template-columns: 1fr;
            }
        }

        .leader-card {
            background: rgba(30, 30, 35, 0.8);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 3rem 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        .leader-card:nth-child(1) { border-top: 4px solid #3b82f6; }
        .leader-card:nth-child(2) { border-top: 4px solid #f59e0b; }
